# jigane の作業の入口の定義。Makefile（macOS・Linux）と justfile（Windows）はここから生成する。
# 直すときはこのファイルを直し、`make generate`（Windows は `just generate`）で生成する。
#
# [entrypoints] は二つの方言に共通する事実。方言ごとの書き方は生成器が持つ。
# [[task]] の show_commands = true は、本文の各コマンドを走らせる前に出力へ出す（既定は出さない）。
#   黙って落ちるコマンドがあっても、どの段で止まったかが出力に残る。
# [[task]] の posix_commands は、commands の後に Makefile（macOS・Linux）にだけ続けて走らせるコマンド。
#   justfile（Windows）には出さない。POSIX の仕組みに頼る試験の置き場（tests_posix）を走らせるのに使う。
# [[task]] の commands の中の置換:
#   {args}           呼び出し側が渡した引数（make は ARGS="..."、just は後ろに続けた引数）
#   {invocation_dir} 呼び出した場所
#   {project_dir}    jigane 自身の木（Makefile・justfile の置き場）

[entrypoints]
summary = "jigane の作業の入口"
regenerate_task = "generate"
uv_missing_message = "uv が見つかりません"
uv_install_message = "公式の方法で導入してから再実行してください"
uv_install_url = "https://docs.astral.sh/uv/getting-started/installation/"
clone_url = "https://github.com/kokiTakashiki/jigane"
recurse_submodules = false

[[task]]
name = "jigane"
description = "jigane の副コマンドを、呼び出した場所で走らせる"
commands = ["uv run --locked --directory {invocation_dir} --project {project_dir} jigane {args}"]

[[task]]
name = "setup"
show_commands = true
description = "依存を uv.lock のとおりに入れ、文法を取得する（組み込みと、例のパッケージの言語の分）"
commands = [
  "uv sync --locked",
  "uv run --locked python -m jigane.languages.fetch_main fetch",
  "uv run --locked python scripts/fetch_example_grammars.py",
  "uv run --locked python scripts/gate_stamp.py install-hook",
]

[[task]]
name = "preflight"
description = "作業ツリーが setup 済みかを、通信せずに確かめる（.venv と文法の置き場のファイルの有無だけ。setup は走らせない。無ければ一行の案内を出して止まる）"
commands = ["uv run --no-project python {project_dir}/scripts/check_setup.py --env {project_dir}"]

[[task]]
name = "lint"
show_commands = true
description = "規則・整形・型（Linux・macOS と win32 の両方として読む）・Markdown・依存宣言・使われていないコード・層の向き・外への送り先・依存のライセンス・呼び出しの形（ast-grep）を検査する（直さない）"
commands = [
  "uv run --locked ruff check .",
  "uv run --locked ruff format --check .",
  "uv run --locked mypy",
  # mypy は --platform が違うとキャッシュを捨てて全体を読み直す。二つの回が同じキャッシュを使うと、互いのキャッシュを毎回捨てるので、win32 の回は置き場を分ける
  "uv run --locked mypy --platform win32 --cache-dir .mypy_cache/win32",
  "uv run --locked rumdl check .",
  "uv run --locked deptry jigane",
  "uv run --locked vulture",
  "uv run --locked python scripts/generate_import_contracts.py --check",
  "uv run --locked python scripts/generate_package_readme.py --check",
  "uv run --locked python scripts/generate_readme_dependencies.py --check",
  "uv run --locked lint-imports",
  "uv run --locked python scripts/check_workflows.py",
  "uv run --locked python scripts/check_egress.py",
  "uv run --locked python scripts/check_dependency_licenses.py",
  "uv run --locked python scripts/check_noqa_reasons.py",
  "uv run --locked ast-grep test",
  "uv run --locked ast-grep scan jigane tests scripts docs",
]

[[task]]
name = "fmt"
show_commands = true
description = "整形し、自動で直せる違反を直す"
commands = [
  "uv run --locked ruff format .",
  "uv run --locked ruff check --fix .",
  "uv run --locked rumdl fmt .",
]

[[task]]
name = "test"
show_commands = true
description = "テストを走らせる（JIGANE_HOME は一時の場所へ向ける。macOS・Linux では POSIX だけの試験 tests_posix も走らせる）"
commands = ["uv run --locked --project {project_dir} python {project_dir}/scripts/with_temp_jigane_home.py uv run --locked pytest"]
posix_commands = ["uv run --locked --project {project_dir} python {project_dir}/scripts/with_temp_jigane_home.py uv run --locked pytest tests_posix"]

[[task]]
name = "generate"
description = "この定義から Makefile と justfile を、build_parser から README の副コマンドの一覧表を、ClaudeInput から SECURITY.md の Claude Code への入力の表を、層と兄弟の依存の表から import-linter の兄弟の契約を、層の契約と各サブパッケージの README から jigane/README.md の表と層の図を、grimp で測った import から各サブパッケージの README の依存の一覧を作り直す"
commands = [
  "uv run --locked --directory {project_dir} python scripts/generate_entrypoints.py",
  "uv run --locked --directory {project_dir} python scripts/generate_command_table.py",
  "uv run --locked --directory {project_dir} python scripts/generate_claude_inputs_table.py",
  "uv run --locked --directory {project_dir} python scripts/generate_import_contracts.py",
  "uv run --locked --directory {project_dir} python scripts/generate_package_readme.py",
  "uv run --locked --directory {project_dir} python scripts/generate_readme_dependencies.py",
]

[[task]]
name = "flaky-hunt"
description = "試験の揺れを測る。乱順の種と並列の数を変えて同じ試験を繰り返し、落ちた試験と種を表にする（引数はそのまま scripts/flaky_hunt.py へ通す。--help を見る。落ちた回の出力は一時の置き場に残す。ゲートには入れない）"
commands = ["uv run --locked --directory {project_dir} python scripts/flaky_hunt.py {args}"]

[[task]]
name = "check-commit-emails"
description = "指定した範囲のコミットの作者と委託者のメールアドレスが GitHub の noreply だけであることを確かめる（引数は git log の版の範囲で必須。例 ARGS=\"origin/main..HEAD\"。呼び出した場所の git リポジトリを見る。ゲートには入れない）"
commands = ["uv run --locked --directory {project_dir} python scripts/check_commit_emails.py --root {invocation_dir} {args}"]

[[task]]
name = "check"
description = "機械のゲート。lint と test を通し、緑で終わったときだけ HEAD に印を書く（push 前の hook が印と照らす）"
depends = ["preflight", "lint", "test"]
commands = ["uv run --locked --directory {project_dir} python scripts/gate_stamp.py write"]

[[task]]
name = "docs-check"
description = "文書のゲート。Markdown を rumdl で検査し、緑で終わったときだけ HEAD に docs の印を書く（文書だけを変えた push は、この印で通る）"
commands = [
  "uv run --locked rumdl check .",
  "uv run --locked --directory {project_dir} python scripts/gate_stamp.py write --gate docs",
]

[[task]]
name = "changed-tests"
show_commands = true
description = "変更に関わる試験だけを走らせる（main との merge-base からの差分と未コミットの変更が対象。--list は選ぶだけ。全体は CI で確かめる）"
commands = ["uv run --locked --project {project_dir} python {project_dir}/scripts/with_temp_jigane_home.py uv run --locked --directory {project_dir} python scripts/changed_tests.py {args}"]

[[task]]
name = "quick-check"
description = "軽い機械のゲート。lint と、変更に関わる試験だけを通す（全体の試験は push して CI で確かめる）"
depends = ["preflight", "lint", "changed-tests"]

[[task]]
name = "audit-dependencies"
description = "uv.lock が固定した依存の既知の脆弱性を pip-audit で確かめる（見つかれば失敗する。ネットワークを使い、同じ uv.lock でも日によって結果が変わるため、ゲートには入れない。週ごとの CI と配布の前の確かめが走らせる）"
commands = ["uv run --locked --directory {project_dir} python scripts/audit_dependencies.py"]

[[task]]
name = "check-repo-settings"
description = "GitHub のリポジトリの設定を .github/repository-settings.json の期待と照らして差を出す（引数は --repo owner/name と --profile working|public で必須。例 ARGS=\"--repo owner/name --profile public\"。gh の認証が要る。ゲートには入れない）"
commands = ["uv run --locked --directory {project_dir} python scripts/check_repo_settings.py {args}"]
