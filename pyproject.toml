[project]
name = "jigane"
version = "0.1.3"
description = "GitHub の PR のレビューを助ける CLI"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # 0.26.0 のバインディングは、行数の多いファイルで節点の位置を壊し segfault する（0.25.2 では起きない）
    # dependabot は 0.26.0 だけを上げる対象から外している（.github/dependabot.yml）
    "tree-sitter>=0.25,<0.26",
    # 文法の sha256（jigane/languages/grammar-hashes.json）はこの版の値なので、範囲で受けずに固定する
    "tree-sitter-language-pack==1.22.1",
    "pydantic>=2.14.1,<3",
    "pathspec>=1.1.1",
    "jinja2>=3.1.6",
]

[project.scripts]
jigane = "jigane.commands:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    # 呼び出しの形を宣言で検査する（ast-grep/rules/）
    "ast-grep-cli>=0.39",
    "deptry>=0.25.1",
    # 兄弟の依存の試験が import グラフを直接組む（import-linter が内側で使うのと同じもの）
    "grimp>=3.17",
    # 入口の検証をモデルに替えた。受け付けの一致の試験が旧のスキーマを比べ相手に使う
    "jsonschema",
    "import-linter>=2.5",
    # 試験と開発の台本が Markdown をトークンで読む（rich の推移の依存で入っていたものを直接にした）
    "markdown-it-py>=4.0",
    # 外の言語の例。entry point のメタデータを仮想環境に載せ、例の試験を通常の道で走らせる
    "jigane-language-kotlin",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest",
    "pytest-randomly>=3.15.0",
    "pytest-xdist>=3.8.0",
    "ruff",
    # export_public.py が dependabot.yml をコメントを保って書き換える
    "ruamel.yaml>=0.18",
    "rumdl>=0.3.0",
    # export_public.py が entrypoints.toml をコメントと並びを保って書き換える
    "tomlkit>=0.13",
    "types-jsonschema>=4.26.0.20261006",
    "vulture>=2.16",
    "zizmor>=1.0,<2",
]

[tool.uv.sources]
jigane-language-kotlin = { path = "examples/jigane-language-kotlin", editable = true }

[tool.vulture]
# 使われていないコードの検査。引数なしで `vulture` を走らせると、この対象と確かさで検査する。
# vulture_whitelist.py は、文字列や外のライブラリが名前で引く誤検知を一件ずつ理由つきで載せる。
paths = ["jigane", "tests", "tests_posix", "tests_windows", "scripts", "examples", "vulture_whitelist.py"]
min_confidence = 60

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
# PLW1514（unspecified-encoding）は preview の規則。preview = true だけでは他の preview の規則も
# 巻き込むため、explicit-preview-rules で、select に名前を挙げた preview の規則だけを効かせる。
preview = true
explicit-preview-rules = true
select = ["ALL", "PLW1514"]
ignore = [
    "D1", # docstring が無いことの指摘。コードを言い換えるだけの文を増やすため求めない。
    "D403", # 日本語の文で始まる docstring に、英語の先頭の大文字の規則が合わない。
    "D415", # 日本語の文は句点で終わるので、英語の終止符の規則が合わない。
    "RUF001", # 日本語の全角の記号を、紛らわしい文字として誤検出する。
    "RUF002", # 同上（docstring）。
    "RUF003", # 同上（コメント）。
    "COM812", # ruff format と衝突する（ruff の文書が併用しないよう勧めている）。
    "CPY001", # ファイルごとの著作権の表記を求めない。ライセンスは LICENSE が持つ。
    "INP001", # tests や scripts は名前空間のパッケージにせず、__init__.py を置かない流儀による。
    "TRY003", # 日本語の誤りの文を例外に直に渡す流儀で、文を変数へ出すと読みにくくなる。
    "EM101", # 同上（文字列の直渡し）。
    "EM102", # 同上（f 文字列の直渡し）。
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
# キーワード専用の引数は呼ぶ側で名前が見えるので、6〜7 個は束ねずに読める。8 個以上は、位置や範囲のような意味のまとまりで型に束ねる。
max-args = 7

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess.run" = { msg = "外部コマンドの起動は jigane.git.process.run_command か jigane.llm_runs.claude.run を経由する" }
"subprocess.Popen" = { msg = "外部コマンドの起動は jigane.git.process.run_command か jigane.llm_runs.claude.run を経由する" }
"subprocess.call" = { msg = "外部コマンドの起動は jigane.git.process.run_command か jigane.llm_runs.claude.run を経由する" }
"subprocess.check_call" = { msg = "外部コマンドの起動は jigane.git.process.run_command か jigane.llm_runs.claude.run を経由する" }
"subprocess.check_output" = { msg = "外部コマンドの起動は jigane.git.process.run_command か jigane.llm_runs.claude.run を経由する" }
"subprocess.getoutput" = { msg = "外部コマンドの起動は jigane.git.process.run_command か jigane.llm_runs.claude.run を経由する" }
"subprocess.getstatusoutput" = { msg = "外部コマンドの起動は jigane.git.process.run_command か jigane.llm_runs.claude.run を経由する" }
"os.system" = { msg = "外部コマンドの起動は jigane.git.process.run_command か jigane.llm_runs.claude.run を経由する" }
"os.popen" = { msg = "外部コマンドの起動は jigane.git.process.run_command か jigane.llm_runs.claude.run を経由する" }
"sys.platform" = { msg = "OS の判定とホームディレクトリの読み出しは store.data_home を経由する" }
"pathlib.Path.home" = { msg = "OS の判定とホームディレクトリの読み出しは store.data_home を経由する" }
"os.path.expanduser" = { msg = "OS の判定とホームディレクトリの読み出しは store.data_home を経由する" }
"pytest.skip" = { msg = "テストを条件付きで skip しない。実行できない前提なら失敗させる" }
"pytest.xfail" = { msg = "テストを条件付きで skip しない。実行できない前提なら失敗させる" }
"pytest.importorskip" = { msg = "テストを条件付きで skip しない。実行できない前提なら失敗させる" }
"scripts" = { msg = "配布物に入らない根の scripts を本体から import しない。必要なら本体の側へ移す" }
"tests" = { msg = "配布物に入らない根の tests を本体から import しない。必要なら本体の側へ移す" }

[tool.ruff.lint.per-file-ignores]
# pytest の検証は assert 文で書く（S101）。
"tests/*.py" = ["S101"]
# pytest の検証は assert 文で書く（S101）。
"tests_posix/*.py" = ["S101", "PLR2004", "SLF"]
# vulture の許可リスト。名前の出現だけが役目なので、式の文（B018）と私的な名前の参照（SLF001）が並ぶ。
# 一件ごとの理由のコメントが長いので、行の長さ（E501）も許す。
"vulture_whitelist.py" = ["B018", "E501", "SLF001"]
"examples/*/tests/*.py" = ["S101"]
# 試験は期待の値をその場の数で書くほうが読みやすい（PLR2004）。試験は内部の状態を直に確かめる（SLF）。
# pytest は fixture を引数の名前で注入するので、試験関数の引数は束ねられない（PLR0913、PLR0917）。
"tests/**/*.py" = ["PLR0913", "PLR0917", "PLR2004", "SLF"]
# pytest の検証は assert 文で書く（S101）。
"tests_windows/*.py" = ["S101"]
"examples/*/tests/**/*.py" = ["PLR0913", "PLR0917", "PLR2004", "SLF"]
# マシン共通の席の置き場（ホーム直下の .cache）を引くため、ホームの読み出しを許す。
"tests/gate_slots.py" = ["TID251"]
# S603 は、固定の引数で外部コマンドを起こす口（本体の起動の窓口、scripts、試験の補助）に限って外す。信頼できない入力はコマンドにしない。
# 外部コマンドの起動そのものを担う窓口。コマンドは名前で起動する。
"jigane/git/process.py" = ["TID251", "S607", "S603"]
# 開発の道具の起動の口。配布物に入らず、本体から import できない（import-linter の契約「本体（jigane/）は開発の道具の起動口（scripts/dev_launch）を読まない」）。
"scripts/dev_launch.py" = ["TID251", "S603"]
"jigane/llm_runs/claude.py" = ["TID251", "S607"]
# OS の判定とホームディレクトリの唯一の読み出し口。
"jigane/storage/store.py" = ["TID251"]
# 実物の git を起動して作り物のリポジトリを組み立てる。
"tests/test_bots.py" = ["TID251", "S607"]
# 見張りが効くことを、子の pytest を起こして確かめる。
"tests/test_home_guard.py" = ["TID251", "S603"]
# 試験の入口が、JIGANE_HOME を向けた子を起こす。jigane のパッケージを import せず標準ライブラリだけで動く。
"scripts/with_temp_jigane_home.py" = ["TID251", "S603"]
# 依存の監査の入口。標準ライブラリだけで動き、pip-audit の出力をそのまま通す。
"scripts/audit_dependencies.py" = ["TID251", "S603"]
# setup 前の木で走るため、環境の python を直に起こして文法の置き場を問い合わせる。標準ライブラリだけで動く。
"scripts/check_setup.py" = ["TID251", "T201", "S603"]
# 錠を取ってから引数のコマンドを走らせる入口。OS の判定は席の plugin と同じく直に行い、使い方は標準エラーへ出す。
"scripts/run_locked.py" = ["TID251", "T201", "S603"]
# 錠を持つ子を別に起こし、先の子が終わるまで後の子が待つことを確かめる。
"tests_posix/test_run_locked.py" = ["TID251", "S603"]
# make を起こし、setup 前の木でゲートが最初の段で止まることを確かめる。
"tests_posix/test_preflight_make.py" = ["TID251", "S603"]
# 持ち主のプロセスを別に起こし、落としてもロックが外れることを確かめる。
"tests/test_review_lock.py" = ["TID251", "S603"]
"tests/test_pull_request.py" = ["TID251", "S607"]
"tests/pr_support.py" = ["TID251", "S607", "S603"]
"tests/test_repository.py" = ["TID251", "S607", "S603"]
# 繰り返しの経過と表を標準出力へ出す道具。
"scripts/flaky_hunt.py" = ["T201"]
"scripts/check_egress.py" = ["T201"]
"scripts/check_noqa_reasons.py" = ["T201"]
"scripts/check_no_git_stash.py" = ["T201"]
"scripts/check_commit_emails.py" = ["T201"]
"scripts/changed_tests.py" = ["T201"]
"scripts/check_dependency_licenses.py" = ["T201"]
"scripts/check_repo_settings.py" = ["T201"]
"scripts/export_public.py" = ["T201"]
"scripts/gate_stamp.py" = ["T201"]
# CLI の出力そのものを担う。
"jigane/commands/__init__.py" = ["T201"]
"jigane/commands/generation.py" = ["T201"]
"jigane/commands/output.py" = ["T201"]
"jigane/commands/context.py" = ["T201"]
"jigane/commands/consent.py" = ["T201"]
"jigane/commands/terms_consent.py" = ["T201"]
"jigane/commands/subcommands/*.py" = ["T201"]

[tool.importlinter]
# import の層の向きの検査。`lint-imports` が走らせる。層の割り当ては jigane/README.md の「モジュールの関係」の図と
# 同じで、tests/test_package_dependency_diagram.py が一致を確かめる。
# 関数の中の import と `if TYPE_CHECKING:` の中の import も数える（exclude_type_checking_imports を足さないことが、その設定になる）。
root_package = "jigane"
# 外部のパッケージ（dev_launch、scripts）を禁止先に書けるようにする。
include_external_packages = true

[[tool.importlinter.contracts]]
name = "本体（jigane/）は開発の道具の起動口（scripts/dev_launch）を読まない"
type = "forbidden"
source_modules = ["jigane"]
# dev_launch は scripts/ を sys.path に載せた形、scripts は `from scripts import dev_launch` の形を止める。
forbidden_modules = ["dev_launch", "scripts"]

[[tool.importlinter.contracts]]
name = "上の層は下の層を読み、下の層は上の層を読まない（cli > feature > core）"
type = "layers"
containers = ["jigane"]
# 上の層から順に並べる。同じ層の中の兄弟は `:` で繋ぎ、互いの依存を禁じない（`|` は互いを禁じる）。
layers = [
    "commands",
    "design : flaky : judgment_map : llm_runs : policy_materials : pull_request_context : regex : reviews : sequence : skills : technology_list : publishing : static_analysis",
    "storage : groups : git : preconditions : gates : markdown : findings : languages : figures",
]
# 層の契約に入っていないサブパッケージを落とす。足したサブパッケージはどれかの層に入れる。
exhaustive = true
# `__main__` は `python -m jigane` の入口で、層に属さない。
exhaustive_ignores = ["__main__"]

# 同じ層の兄弟どうしの依存は、宣言したものだけを許す。宣言は下の `[tool.jigane.allowed_sibling_imports]` の表が持ち、
# 表で許していない兄弟を全部 forbidden_modules に並べた契約を、サブパッケージごとに scripts/generate_import_contracts.py が
# 印の間へ書く。印の間は手で直さない。新しい兄弟の依存を足すときは、表の import する側へ相手を足して生成器を走らせる。
# サブパッケージを足したときは、layers 契約のどれかの層に入れて生成器を走らせる（表には依存を足すときだけ書く）。
# tests/test_package_dependency_diagram.py が、層の兄弟の組ごとに「禁止の一覧に入っている」と
# 「実際に import している」のちょうど一方だけが成り立つことを確かめる。
# 関数の中の import と `if TYPE_CHECKING:` の中の import も数える（exclude_type_checking_imports を足さない）。
# 間接の依存（A → C → B）は禁止に当てない（allow_indirect_imports）。この契約が宣言させるのは直接の import だけで、
# 間接の経路まで禁じると、宣言済みの依存の先にある兄弟で落ちる。

[tool.jigane.allowed_sibling_imports]
# キーは import する側のサブパッケージ、値は import してよい同じ層の兄弟。書いていないサブパッケージは兄弟を import しない。
figures = ["markdown"]
findings = ["storage", "groups"]
languages = ["storage", "preconditions"]
design = ["judgment_map", "reviews", "sequence"]
flaky = ["judgment_map", "regex"]
policy_materials = ["design", "judgment_map", "reviews", "sequence"]
publishing = ["reviews"]
pull_request_context = ["judgment_map"]
regex = ["judgment_map"]
reviews = ["flaky", "judgment_map", "pull_request_context", "static_analysis"]
sequence = ["judgment_map", "reviews"]
skills = ["design", "judgment_map", "llm_runs", "policy_materials", "pull_request_context", "regex", "reviews", "sequence", "technology_list"]
static_analysis = ["judgment_map"]
technology_list = ["reviews"]

# BEGIN GENERATED: sibling-contracts (scripts/generate_import_contracts.py)

