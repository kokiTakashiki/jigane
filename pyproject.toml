# END GENERATED: sibling-contracts

# 言語ごとの実装を引く registry は、文法の定義と言語の基底から読まない（registry がそれらを読むので、逆向きは循環になる）。
# flaky の検出は registry を読むが、関数の中で読むことだけを tests/test_grammar_layering.py が禁じる。この契約は関数の中かを区別できない。
[[tool.importlinter.contracts]]
name = "文法の定義と言語の基底は languages.registry を読まない"
type = "forbidden"
source_modules = ["jigane.languages.grammars", "jigane.languages.base"]
forbidden_modules = ["jigane.languages.registry"]

# 言語に依存しない sequence の index と resolve は、C# の実装を読まない。
[[tool.importlinter.contracts]]
name = "sequence の index と resolve は languages.csharp を読まない"
type = "forbidden"
source_modules = ["jigane.sequence.index", "jigane.sequence.resolve"]
forbidden_modules = ["jigane.languages.csharp"]

[tool.deptry]
# first-party は配布物に入る jigane だけ。scripts や tests は含めず、本体からの import を未宣言の依存として落とす。
known_first_party = ["jigane"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/jigane-language-kotlin/tests"]
# 試験が tests の共有の補助（fakes など）を、試験が scripts の共有の定義を import できるようにする。
pythonpath = ["tests", "scripts"]
# 全件の所要の大半は git と CLI の子プロセスの待ちで、CPU を使い切っていない。並列で待ちを重ねる。
# 一件ずつ追うときは `-n 0` で直列に戻す。
# 乱順（pytest-randomly）は既定では切る。`just flaky-hunt` だけが `-p randomly` で有効にする。
addopts = "-q --strict-markers --strict-config -n auto -p no:randomly"
xfail_strict = true
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["jigane", "scripts", "tests", "tests_posix", "tests_windows", "examples/jigane-language-kotlin"]
# tests が scripts の共有の定義（workflow_rules）を import できるようにする。
mypy_path = "scripts"

[tool.rumdl]
disable = [
    "MD013", # 行長は自然文を折り返さない方針と両立しないため無効化。
    "MD041", # frontmatter の直後に本文が続き、先頭が H1 でない文書がある。
]
exclude = [
    ".venv/**",
    ".git/**",
    "node_modules/**",
    ".mypy_cache/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
]
