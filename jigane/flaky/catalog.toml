# flaky の型の目録。言語に依らない欄だけを持つ。言語ごとの query は queries/<言語>.toml に置く。
# [item.equivalent.<言語>] は言語ごとの、相当する既製のリンタの規則の状態。state は found（rules と note が要る）、
# none（確かめた結果、相当は無い。note は補足で任意）、unverified（この環境で確かめられなかった。rules と note は持たない）。jigane が自作する共通の理由は
# docs/decisions/incoming/flaky-rules-on-tree-sitter.md に書いてあり、ここには項目ごとの違いだけを書く。
# source の Luo らの調査は、Luo et al., "An Empirical Analysis of Flaky Tests", FSE 2014。

[[item]]
id = "FLK-ASYNC-WAIT"
cause = "Async Wait"
confidence = "direct"
source = "Luo らの 2014 年の調査の Async Wait の分類です。固定時間の待ちは、非同期の処理の完了を時間で仮定します。"
legitimate = "レート制限や再試行の間隔そのものを検査するテストで、時間の経過が検査の対象のときです。"
concern = "固定時間の待ちは、非同期の処理が終わる時間を決め打ちしているため、環境が遅いと検査が外れます。"
violation = "テストが sleep で処理の完了を時間で仮定していて、完了そのものを待っていません。"
direction = "固定時間の sleep をやめ、完了を示すイベントや条件を待ってください（上限つきのポーリング、完了通知の待ち）。時間そのものを検査するなら、時計を差し替えられるようにして進めてください。"

[item.equivalent.python]
state = "found"
rules = ["ruff ASYNC251"]
note = "async 関数の中の time.sleep だけを検出します。同期のテストの sleep は対象外で、jigane は両方を検出します。"

