source = "Luo らの 2014 年の調査の Time の分類です。実時間の経過を数の上限と比べる assert は、実行する環境の負荷で結果が変わります。Python の標準ライブラリの文書は、time.monotonic と time.perf_counter を経過時間の計測用の時計と定めています。"
