[[item]]
id = "FLK-TIME"
cause = "Time"
confidence = "direct"
source = "Luo らの 2014 年の調査の Time の分類です。現在時刻への依存は、実行する時刻で結果が変わります。Python の標準ライブラリの文書は datetime.now が実行時の時刻を返すと定めています。"
legitimate = "時刻を固定する仕組み（freezegun や time-machine）の内側で呼ぶときと、経過時間の計測を検査するときです。Python で共通のセットアップの autouse の fixture が固定している場合は、検出器が警告に下げます。字面の `with freeze_time(...)` や `@freeze_time(...)` の内側は検出しません。"
concern = "現在時刻に依存したテストは、実行する時刻によって結果が変わります。"
violation = "テストが現在時刻を直接読んでいて、時刻を固定していません。"
direction = "現在時刻を引数や注入した時計として受け取り、テストでは固定した時刻を渡してください。"

